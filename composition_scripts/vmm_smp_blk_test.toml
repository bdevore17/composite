[system]
description = "Simple VMM: SMP guest with a virtio-blk disk"
# A 4-vCPU Linux guest (vCPU i on core i) with a 32MB RAM-disk virtio-blk
# device. The "smp-blk" guest image runs a self-test at boot: it checks that
# every vCPU came online and does a raw and an ext2 round trip on /dev/vda,
# printing "SMPBLK PASS/FAIL" lines and "SMPBLK DONE: <n> failure(s)".
# Needs VT-x; see simple_vmm/vm_dev.md, "Testing SMP and virtio-blk".

[[components]]
name = "booter"
img  = "no_interface.llbooter"
implements = [{interface = "init"}, {interface = "addr"}]
deps = [{srv = "kernel", interface = "init", variant = "kernel"}]
constructor = "kernel"

[[components]]
name = "capmgr"
img  = "capmgr.simple"
deps = [{srv = "booter", interface = "init"}, {srv = "booter", interface = "addr"}]
implements = [{interface = "capmgr"}, {interface = "init"}, {interface = "memmgr"}, {interface = "capmgr_create"}, {interface = "contigmem"}]
constructor = "booter"
baseaddr = "0x1000000"

[[components]]
name = "sched"
img  = "sched.pfprr_quantum_static"
deps = [{srv = "capmgr", interface = "init"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "sched"}, {interface = "syncipc"}, {interface = "init"}]
constructor = "booter"
baseaddr = "0x1600000"

[[components]]
name = "vmm"
img  = "simple_vmm.vmm"
# The guest to boot (built on demand by the vmimg submodule), the number of
# vCPUs (at most NUM_CPU) and the RAM disk size. Values are substituted
# verbatim into #defines, so the quotes around the path must be escaped.
constants = [{variable = "VM_GUEST_IMAGE", value = "\"guest/vmlinux-smp-blk-5.15.107.img\""},
             {variable = "VM_NUM_VCPUS", value = "4"},
             {variable = "VM_BLK_DISK_MB", value = "32"}]
deps = [{srv = "sched", interface = "sched"}, {srv = "sched", interface = "init"},{srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}, {srv = "capmgr", interface = "contigmem"}]
implements = []
constructor = "booter"
baseaddr = "0x2000000"
